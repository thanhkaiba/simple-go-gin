<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Attendance{% endblock %}</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1d2330; --muted: #667085; --line: #e3e7ec; --hover: #f8fafc;
    --brand: #2563eb; --brand-dark: #1d4ed8;
    --ok: #15803d; --ok-bg: #dcfce7; --late: #b45309; --late-bg: #fef3c7;
    --bad: #b91c1c; --bad-bg: #fee2e2; --info: #475569; --info-bg: #e2e8f0;
    --radius: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  a { color: var(--brand); text-decoration: none; } a:hover { text-decoration: underline; }

  /* top bar */
  .topbar { background: #111827; color: #fff; position: sticky; top: 0; z-index: 10; }
  .topbar-inner { max-width: 1160px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 22px; overflow-x: auto; }
  .brand { font-weight: 700; white-space: nowrap; padding: 14px 0; }
  .nav { display: flex; gap: 4px; }
  .nav a { color: #cbd5e1; padding: 8px 12px; border-radius: 8px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .nav a:hover { background: #1f2937; color: #fff; text-decoration: none; }
  .nav a.on { background: #374151; color: #fff; }
  .count { background: var(--bad); color: #fff; border-radius: 999px; font-size: 12px; padding: 0 7px; font-weight: 600; }

  main { max-width: 1160px; margin: 0 auto; padding: 20px 16px 80px; }
  h1 { font-size: 1.5em; margin: 0; } h2 { font-size: 1.1em; margin: 0 0 10px; }
  .page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .subtitle { color: var(--muted); margin: 2px 0 0; }
  .muted { color: var(--muted); } .small { font-size: .88em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .card > h2:first-child { margin-top: 0; }

  /* buttons and inputs */
  button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--text);
                 padding: 7px 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover, .btn:hover { background: var(--hover); text-decoration: none; }
  .btn-primary, button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover, button.primary:hover { background: var(--brand-dark); }
  .btn-danger, button.danger { color: var(--bad); border-color: #fecaca; }
  .btn-danger:hover, button.danger:hover { background: var(--bad-bg); }
  .btn-sm { padding: 4px 10px; font-size: .9em; }
  .btn-group { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { font: inherit; padding: 7px 10px; border: 1px solid #cfd6de; border-radius: 8px; background: #fff; color: var(--text); }
  input:focus, select:focus { outline: 2px solid #bfdbfe; border-color: var(--brand); }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: .9em; color: var(--muted); }
  label.field > input, label.field > select { color: var(--text); font-size: 1.05em; }
  label.check { display: inline-flex; align-items: center; gap: 8px; }
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .grow { flex: 1 1 320px; }
  .hint { font-size: .85em; color: var(--muted); }

  /* badges, alerts, tables */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85em; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.late { background: var(--late-bg); color: var(--late); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }
  .alert { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start; }
  .alert.warn { background: var(--late-bg); color: #78350f; } .alert.error { background: var(--bad-bg); color: #7f1d1d; }
  .alert.ok { background: var(--ok-bg); color: #14532d; } .alert.info { background: #dbeafe; color: #1e3a8a; }
  .alert .close { margin-left: auto; background: none; border: 0; padding: 0 4px; color: inherit; font-size: 18px; line-height: 1; }
  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 10px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  th { font-size: .82em; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: #f9fafb; font-weight: 600; }
  tbody tr:hover { background: var(--hover); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--info-bg); display: block; }
  .avatar.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 600; }
  .empty-state { text-align: center; color: var(--muted); padding: 36px 16px; }
  tr.editable { cursor: pointer; }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
          padding: 12px 16px; text-align: left; display: block; color: var(--text); }
  .tile .n { font-size: 1.9em; font-weight: 700; line-height: 1.2; } .tile .l { color: var(--muted); font-size: .9em; }
  button.tile { width: 100%; } button.tile:hover { border-color: #cbd5e1; }
  .tile.active { outline: 2px solid var(--brand); }
  .tile.ok .n { color: var(--ok); } .tile.late .n { color: var(--late); } .tile.bad .n { color: var(--bad); } .tile.info .n { color: var(--info); }

  dialog { border: 0; border-radius: 14px; padding: 0; width: min(460px, 94vw); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  .dialog-head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .dialog-body { padding: 16px 20px; display: grid; gap: 18px; }
  .dialog-body form { display: grid; gap: 6px; }
  .dialog-body .form-row { align-items: center; }
  details.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 16px; box-shadow: var(--shadow); }
  details.panel > summary { cursor: pointer; padding: 12px 16px; font-weight: 600; list-style: none; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary::before { content: "▸ "; color: var(--muted); }
  details.panel[open] > summary::before { content: "▾ "; }
  details.panel > div { padding: 0 16px 16px; }
  @media (max-width: 700px) { .hide-sm { display: none; } th, td { padding: 8px 10px; } }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <span class="brand">📷 Attendance</span>
  <nav class="nav">
    <a href="{{ url_for('index') }}" class="{{ 'on' if nav == 'index' }}">Today</a>
    <a href="{{ url_for('report') }}" class="{{ 'on' if nav == 'report' }}">Late &amp; absence report</a>
    <a href="{{ url_for('unknowns') }}" class="{{ 'on' if nav == 'unknowns' }}">To review{% if pending %} <span class="count">{{ pending }}</span>{% endif %}</a>
    <a href="{{ url_for('employees') }}" class="{{ 'on' if nav in ('employees', 'employee') }}">Employees</a>
    <a href="{{ url_for('live_page') }}" class="{{ 'on' if nav == 'live_page' }}">Live camera</a>
    <a href="{{ url_for('settings_page') }}" class="{{ 'on' if nav == 'settings_page' }}">Settings</a>
    <a href="{{ url_for('audit') }}" class="{{ 'on' if nav == 'audit' }}">Change log</a>
  </nav>
</div></div>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert {{ 'warn' if category == 'warn' else category }}" data-flash="{{ category }}">
      <span>{{ message }}</span><button class="close" type="button" onclick="this.parentElement.remove()" aria-label="Close">×</button>
    </div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
<script>
  // Success messages disappear by themselves; warnings and errors stay until closed.
  setTimeout(() => document.querySelectorAll('[data-flash="ok"]').forEach(el => el.remove()), 6000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
