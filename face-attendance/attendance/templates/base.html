<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Camera attendance{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#656d76; --line:#d8dee4;
          --ok:#1a7f37; --late:#bc4c00; --bad:#cf222e; --accent:#0969da; --warnbg:#fff8c5; --errbg:#ffebe9; --okbg:#dafbe1; }
  * { box-sizing: border-box; }
  body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { background: #24292f; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; }
  header strong { margin-right: 12px; }
  header a { color: #d0d7de; text-decoration: none; padding: 4px 0; }
  header a.on { color: #fff; border-bottom: 2px solid #fff; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4em; margin: 8px 0 12px; } h2 { font-size: 1.1em; margin: 24px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  table { border-collapse: collapse; width: 100%; background: var(--card); }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
  th { font-weight: 600; color: var(--muted); font-size: .9em; }
  img.thumb { height: 54px; border-radius: 4px; display: block; }
  .muted { color: var(--muted); } .ok { color: var(--ok); } .late { color: var(--late); } .bad { color: var(--bad); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .85em; border: 1px solid currentColor; }
  .flash { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
  .flash.ok { background: var(--okbg); } .flash.error { background: var(--errbg); } .flash.warn, .warn { background: var(--warnbg); }
  .warn { padding: 8px 12px; border-radius: 6px; margin: 8px 0; }
  input, select, button, textarea { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button { cursor: pointer; background: #f6f8fa; } button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.danger { color: var(--bad); }
  form.inline { display: inline-flex; gap: 4px; align-items: center; margin: 2px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .row label { display: flex; flex-direction: column; font-size: .9em; color: var(--muted); gap: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .grid .card { padding: 8px; margin: 0; } .grid img { width: 100%; border-radius: 4px; }
  .stats span { display: inline-block; margin-right: 18px; font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  @media (max-width: 700px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <strong>Attendance</strong>
  <a href="{{ url_for('index') }}" class="{{ 'on' if nav == 'index' }}">Attendance</a>
  <a href="{{ url_for('unknowns') }}" class="{{ 'on' if nav == 'unknowns' }}">Unidentified ({{ pending }})</a>
  <a href="{{ url_for('employees') }}" class="{{ 'on' if nav in ('employees', 'employee') }}">Employees</a>
  <a href="{{ url_for('report') }}" class="{{ 'on' if nav == 'report' }}">Late &amp; absence report</a>
  <a href="{{ url_for('live_page') }}" class="{{ 'on' if nav == 'live_page' }}">Live camera</a>
  <a href="{{ url_for('settings_page') }}" class="{{ 'on' if nav == 'settings_page' }}">Settings</a>
  <a href="{{ url_for('audit') }}" class="{{ 'on' if nav == 'audit' }}">Change log</a>
</header>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
