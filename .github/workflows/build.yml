# Builds the Face Attendance packages (Python and all libraries included, models downloaded on the
# first start) on each operating system. Pushing a tag such as v1.2.0 publishes them as a GitHub
# release, which installed copies pick up as an automatic update.
name: Build packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish as a release with this version, e.g. 1.2.0 (creates the tag); empty = build only"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x64 }
          - { os: macos-latest, platform: macos-arm64, arch: arm64 }
          - { os: macos-15-intel, platform: macos-x64, arch: x86_64 }
          - { os: ubuntu-22.04, platform: linux-x64 }  # older glibc: runs on more Linux versions
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || -n "${{ inputs.release }}" ]]; then
            VERSION="${{ inputs.release }}"
            [[ -n "$VERSION" ]] || VERSION="${GITHUB_REF_NAME#v}"
            sed -i.bak "s/^__version__ = .*/__version__ = \"$VERSION\"  # set from the release tag/" attendance/__init__.py
          else
            VERSION=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' attendance/__init__.py)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION"

      - name: Install the libraries (Windows, Linux)
        if: runner.os != 'macOS'
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller certifi

      - name: Install the libraries (macOS, for macOS 12 and newer)
        if: runner.os == 'macOS'
        run: |
          # The newest numpy, OpenCV and onnxruntime wheels are built for macOS 13/14 and use
          # Accelerate symbols older systems lack: a package made from them dies on start on a
          # macOS 12 Mac ("Symbol not found: _cblas_...$NEWLAPACK$ILP64"). Resolve the libraries
          # for macOS 12 instead (numpy with OpenBLAS, OpenCV 4.10, onnxruntime 1.19).
          python -m pip install --upgrade pip
          pip download --only-binary=:all: --platform "macosx_12_0_${{ matrix.arch }}" \
            --python-version 3.12 --implementation cp -d wheels -r requirements.txt
          pip install --no-index --find-links wheels -r requirements.txt
          pip install --no-deps .
          pip install pyinstaller certifi
          pip list --format=columns | grep -i -E "numpy|opencv|onnxruntime"

      - name: Build
        run: pyinstaller --noconfirm packaging/face-attendance.spec

      - name: Check that every library runs on macOS 12 (macOS)
        if: runner.os == 'macOS'
        run: python packaging/macos_min_version.py dist/FaceAttendance.app 12

      - name: Test the package (download the models, load them, render the pages)
        run: |
          case "${{ matrix.platform }}" in
            windows-*) EXE=dist/FaceAttendance/FaceAttendance.exe ;;
            macos-*)   EXE=dist/FaceAttendance.app/Contents/MacOS/FaceAttendance ;;
            *)         EXE=dist/FaceAttendance/FaceAttendance ;;
          esac
          export FACE_ATTENDANCE_HOME="$RUNNER_TEMP/home"
          "$EXE" download-models
          "$EXE" self-test

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FaceAttendance -DestinationPath "dist/FaceAttendance-${{ matrix.platform }}.zip"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$env:VERSION" packaging/windows/FaceAttendance.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -C dist -czf "dist/FaceAttendance-${{ matrix.platform }}.tar.gz" FaceAttendance.app
          mkdir -p dmg && cp -R dist/FaceAttendance.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Face Attendance" -srcfolder dmg -ov -format UDZO \
            "dist/FaceAttendance-$VERSION-${{ matrix.platform }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist -czf "dist/FaceAttendance-${{ matrix.platform }}.tar.gz" FaceAttendance
          mkdir -p "pkg/FaceAttendance-$VERSION" && cp -R dist/FaceAttendance packaging/linux/*.sh "pkg/FaceAttendance-$VERSION/"
          chmod +x "pkg/FaceAttendance-$VERSION/"*.sh
          tar -C pkg -czf "dist/FaceAttendance-$VERSION-${{ matrix.platform }}-installer.tar.gz" "FaceAttendance-$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    # Publishes what was built even if one platform failed, so the others still get the update.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # From "Run workflow" the tag does not exist yet: it is created at the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release) }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
          body: |
            **Install:** Windows `FaceAttendance-Setup-*.exe` · macOS `*.dmg` · Linux `*-installer.tar.gz` (unpack, run `./install.sh`).
            The face models (about 300 MB) are downloaded on the first start. Installed copies update themselves.
            The other `FaceAttendance-<platform>` archives are used by the automatic update.
